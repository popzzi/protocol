<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>APEX Protocol Status Reporter</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Kakao JavaScript SDK -->
  <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-blue-200 min-h-screen pb-10">

  <!-- Header -->
  <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
    <h1 class="text-lg font-bold tracking-tight">✈️ APEX Protocol</h1>
    <button onclick="loadSchedules()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition">
      🔄 새로고침
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- 0. 보고 수신 대상 지정 -->
    <section class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-1.5">
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">
          보고 수신 대상 선택
        </label>
        <span id="targetBadge" class="text-[10px] bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-full">의전 1팀</span>
      </div>
      <select id="targetGroupSelect" onchange="onTargetGroupChange()" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 outline-none font-semibold">
        <option value="TEAM1">[의전 현장 1팀 단체방]</option>
        <option value="TEAM2">[의전 현장 2팀 단체방]</option>
        <option value="MANAGER">[총괄 매니저 직보고]</option>
        <option value="CLIENT">[클라이언트 / B2B 전용]</option>
      </select>
    </section>

    <!-- 1. 스케줄 선택 섹션 -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
        1. 담당 고객 선택
      </label>
      <select id="scheduleSelect" onchange="onScheduleChange()" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-base rounded-xl focus:ring-blue-500 focus:border-blue-500 p-3 outline-none font-medium">
        <option value="">스케줄을 불러오는 중...</option>
      </select>
      
      <!-- 선택된 고객 요약 정보 -->
      <div id="selectedInfoCard" class="mt-3 p-3 bg-blue-50 rounded-xl border border-blue-100 hidden">
        <div class="flex justify-between items-center text-sm font-bold text-blue-900">
          <span id="cardGuest">홍길동 님</span>
          <span id="cardFlight" class="bg-blue-200 px-2 py-0.5 rounded text-xs text-blue-800">KE902</span>
        </div>
        <div class="text-xs text-blue-700 mt-1 flex gap-3">
          <span>구분: <strong id="cardType">도착</strong></span>
          <span>터미널: <strong id="cardTerminal">T2</strong></span>
          <span>예정시간: <strong id="cardTime">14:30</strong></span>
        </div>
      </div>
    </section>

    <!-- 2. 원터치 보고 버튼 섹션 -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-2.5">
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">
        2. 상태 선택 (원터치 보고)
      </label>

      <div class="grid grid-cols-1 gap-2.5">
        <button onclick="triggerReport('고객 접견 완료')" class="w-full py-3.5 px-4 bg-slate-800 hover:bg-slate-900 active:scale-[0.98] text-white font-bold rounded-xl shadow transition flex items-center justify-between">
          <span>고객 접견 완료</span>
          <span class="text-xs font-normal text-slate-400">전송 ➔</span>
        </button>

        <button onclick="triggerReport('CIQ 수속장 이동 중')" class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold rounded-xl shadow transition flex items-center justify-between">
          <span>CIQ 수속장 이동 중</span>
          <span class="text-xs font-normal text-blue-200">전송 ➔</span>
        </button>

        <button onclick="triggerReport('보안검색 및 출국심사 진행 중')" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold rounded-xl shadow transition flex items-center justify-between">
          <span>보안검색 / 심사 중</span>
          <span class="text-xs font-normal text-indigo-200">전송 ➔</span>
        </button>

        <button onclick="triggerReport('라운지 / 게이트 이동 중')" class="w-full py-3.5 px-4 bg-purple-600 hover:bg-purple-700 active:scale-[0.98] text-white font-bold rounded-xl shadow transition flex items-center justify-between">
          <span>라운지 / 게이트 이동</span>
          <span class="text-xs font-normal text-purple-200">전송 ➔</span>
        </button>

        <button onclick="triggerReport('최종 인계 및 서비스 완료')" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold rounded-xl shadow transition flex items-center justify-between">
          <span>최종 인계/서비스 완료</span>
          <span class="text-xs font-normal text-emerald-200">전송 ➔</span>
        </button>
      </div>
    </section>

    <!-- 3. 실시간 생성 문구 미리보기 -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-2">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">
          생성될 문구 미리보기
        </label>
        <button onclick="copyToClipboardOnly()" class="text-xs text-blue-600 font-semibold hover:underline">
          텍스트만 복사
        </button>
      </div>
      <textarea id="previewText" rows="6" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono text-slate-700 outline-none resize-none" readonly></textarea>
    </section>

  </main>

  <!-- Toast 알림 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50">
    문구가 클립보드에 복사되었습니다.
  </div>

  <script>
    // 1. 설정값 입력
    const KAKAO_JAVASCRIPT_KEY = '9d471ba172dbeb48ead35224a6d1b241'; // 카카오 개발자 센터의 JavaScript 키
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzy6oj6qjsXsjYd9aKDJp5SwsTm4k3wVO7VWxLzR958Pw-yuw8suDfbX_ssCPA-zHvL/exec'; // Apps Script 웹 앱 배포 URL (/exec로 끝나는 주소)
    const API_SECRET_KEY = 'apex-protocol-secret-key-2026'; // Code.gs에 설정한 키와 동일하게 맞춤

    let scheduleDataList = [];
    let currentSelected = null;
    let lastStatusText = "진행 상황을 선택해 주세요.";

    window.onload = function() {
      // 카카오 SDK 초기화
      if (KAKAO_JAVASCRIPT_KEY && typeof Kakao !== 'undefined') {
        if (!Kakao.isInitialized()) {
          Kakao.init(KAKAO_JAVASCRIPT_KEY);
        }
      }
      loadSchedules();
    };

    /**
     * Apps Script 백엔드로 fetch API 연동
     */
    function loadSchedules() {
      const select = document.getElementById('scheduleSelect');
      select.innerHTML = '<option value="">⏳ 시트에서 목록을 불러오는 중...</option>';

      const requestUrl = `${GAS_WEBAPP_URL}?key=${API_SECRET_KEY}`;

      fetch(requestUrl)
        .then(response => response.json())
        .then(res => {
          if (res.status === "success") {
            renderSchedules(res.data);
          } else {
            alert("인증 오류 또는 데이터를 가져올 수 없습니다.");
            select.innerHTML = '<option value="">❌ 로딩 실패 (권한 에러)</option>';
          }
        })
        .catch(err => {
          alert("네트워크 통신 에러: " + err);
          select.innerHTML = '<option value="">❌ 로딩 실패 (새로고침해 주세요)</option>';
        });
    }

    function renderSchedules(data) {
      scheduleDataList = data;
      const select = document.getElementById('scheduleSelect');
      select.innerHTML = '';

      if (!data || data.length === 0) {
        select.innerHTML = '<option value="">등록된 스케줄 데이터가 없습니다.</option>';
        document.getElementById('selectedInfoCard').classList.add('hidden');
        return;
      }

      data.forEach((item, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `[${item.type}] ${item.guestName} (${item.flightNo}) | ${item.scheduleTime || '시간미정'}`;
        select.appendChild(opt);
      });

      select.selectedIndex = 0;
      onScheduleChange();
    }

    function onTargetGroupChange() {
      const select = document.getElementById('targetGroupSelect');
      const badge = document.getElementById('targetBadge');
      
      const targetMap = {
        'TEAM1': '의전 1팀',
        'TEAM2': '의전 2팀',
        'MANAGER': '총괄매니저',
        'CLIENT': '클라이언트'
      };
      
      badge.textContent = targetMap[select.value] || '선택됨';
      updatePreview(lastStatusText);
    }

    function onScheduleChange() {
      const select = document.getElementById('scheduleSelect');
      const idx = select.value;
      
      if (idx === "" || !scheduleDataList[idx]) {
        currentSelected = null;
        document.getElementById('selectedInfoCard').classList.add('hidden');
        return;
      }

      currentSelected = scheduleDataList[idx];
      
      document.getElementById('cardGuest').textContent = currentSelected.guestName;
      document.getElementById('cardFlight').textContent = currentSelected.flightNo;
      document.getElementById('cardType').textContent = currentSelected.type;
      document.getElementById('cardTerminal').textContent = currentSelected.terminal;
      document.getElementById('cardTime').textContent = currentSelected.scheduleTime || '-';
      document.getElementById('selectedInfoCard').classList.remove('hidden');

      updatePreview("진행 상황을 선택해 주세요.");
    }

    function generateMessage(statusText) {
      if (!currentSelected) return "고객을 먼저 선택해 주세요.";

      const targetType = document.getElementById('targetGroupSelect').value;
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const currentTimeStr = `${hours}:${minutes}`;

      let header = "";
      let footer = "";

      switch(targetType) {
        case 'TEAM1':
          header = `[📢 의전 1팀 현장 공유]`;
          footer = `팀원분들 참고 부탁드립니다.`;
          break;
        case 'TEAM2':
          header = `[📢 의전 2팀 현장 공유]`;
          footer = `2팀 현장 동선 확인 부탁드립니다.`;
          break;
        case 'MANAGER':
          header = `[👤 총괄 매니저 보고]`;
          footer = `특이사항 없이 계획대로 진행 중입니다.`;
          break;
        case 'CLIENT':
          header = `[🏢 VIP 의전 진행 경과보고]`;
          footer = `최상의 서비스로 정성껏 모시겠습니다.`;
          break;
        default:
          header = `[의전 진행 경과보고]`;
          footer = `차질 없이 진행 중입니다.`;
      }

      return `${header}\n` +
             `• 고객명: ${currentSelected.guestName} (${currentSelected.flightNo})\n` +
             `• 구분/터미널: ${currentSelected.type} / ${currentSelected.terminal}\n` +
             `• 현재상황: ${statusText}\n` +
             `• 보고시각: ${currentTimeStr}\n\n` +
             `${footer}`;
    }

    function updatePreview(statusText) {
      lastStatusText = statusText;
      const msg = generateMessage(statusText);
      document.getElementById('previewText').value = msg;
    }

    function triggerReport(statusText) {
      if (!currentSelected) {
        alert("고객을 먼저 선택해 주세요.");
        return;
      }

      lastStatusText = statusText;
      const finalMsg = generateMessage(statusText);
      document.getElementById('previewText').value = finalMsg;

      // 1. 클립보드 자동 복사
      navigator.clipboard.writeText(finalMsg).catch(() => {});

      // 2. 진동 피드백
      if (navigator.vibrate) navigator.vibrate(50);

      // 3. Kakao SDK 공유 실행 (GitHub Pages 도메인이므로 오류 없이 구동)
      if (typeof Kakao !== 'undefined' && Kakao.isInitialized()) {
        Kakao.Share.sendDefault({
          objectType: 'feed',
          text: finalMsg,
          buttons: []
          // link: {
          //   mobileWebUrl: 'https://developers.kakao.com',
          //   webUrl: 'https://developers.kakao.com',
          // },
          // buttonTitle: ''
        });
      } else {
        alert("카카오 SDK 초기화에 실패했습니다. 키 설정을 확인해 주세요.");
      }
    }

    function copyToClipboardOnly() {
      const text = document.getElementById('previewText').value;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast("미리보기 문구가 복사되었습니다.");
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }
  </script>
</body>
</html>
