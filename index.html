<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PPI Protocol Status Reporter</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Kakao JavaScript SDK -->
  <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" type="text/css"/>
  <style>
    body { -webkit-tap-highlight-color: transparent;  font-family: 'Paperlogy', sans-serif !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-blue-200 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-tight">PPI Protocol</h1>
    <button onclick="loadSchedules()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg border border-slate-700 transition font-medium">
      새로고침
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- 0. 보고 수신 대상 선택 (타이틀 삭제, Default: 보고 대상 선택) -->
    <section>
      <div class="relative">
        <button id="targetGroupBtn" onclick="toggleTargetMenu()" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-base rounded-xl p-3.5 text-left font-semibold flex justify-between items-center">
          <span id="targetGroupLabel">보고 대상 선택</span>
          <span class="text-xs text-slate-400">▼</span>
        </button>
  
        <!-- 커스텀 옵션 레이어 -->
        <div id="targetMenu" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-30 overflow-hidden divide-y divide-slate-100">
          <div onclick="selectTargetGroup('TEAM1', '[의전 현장 1팀 단체방]')" class="p-3.5 text-sm hover:bg-slate-50 cursor-pointer font-medium">
            [의전 현장 1팀 단체방]
          </div>
          <div onclick="selectTargetGroup('TEAM2', '[의전 현장 2팀 단체방]')" class="p-3.5 text-sm hover:bg-slate-50 cursor-pointer font-medium">
            [의전 현장 2팀 단체방]
          </div>
          <div onclick="selectTargetGroup('MANAGER', '[총괄 매니저 직보고]')" class="p-3.5 text-sm hover:bg-slate-50 cursor-pointer font-medium">
            [총괄 매니저 직보고]
          </div>
          <div onclick="selectTargetGroup('CLIENT', '[클라이언트 / B2B 전용]')" class="p-3.5 text-sm hover:bg-slate-50 cursor-pointer font-medium">
            [클라이언트 / B2B 전용]
          </div>
        </div>
      </div>
    </section>

    <!-- 1. 담당 고객 선택 섹션 (상단 셀렉트박스 삭제, 파란색 카드가 스케줄 옵션 버튼 역할 수행) -->
    <section>
      <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">
        담당 고객 선택
      </label>

      <!-- 선택 카드 (클릭 시 커스텀 목록이 열림) -->
      <div class="relative">
        <div id="selectedInfoCard" onclick="toggleScheduleMenu()" class="p-4 bg-blue-50 hover:bg-blue-100/80 transition rounded-xl border border-blue-200 cursor-pointer">
          <div class="flex justify-between items-center text-base font-bold text-blue-950">
            <span id="cardGuest">고객을 선택해 주세요</span>
            <span id="cardFlight" class="bg-blue-200 px-2.5 py-1 rounded text-xs text-blue-800 font-semibold">선택</span>
          </div>
          <div id="cardDetails" class="text-xs text-blue-800 mt-2 flex gap-3 hidden">
            <span>구분: <strong id="cardType">-</strong></span>
            <span>터미널: <strong id="cardTerminal">-</strong></span>
            <span>예정시각: <strong id="cardTime">-</strong></span>
          </div>
        </div>
  
        <!-- 커스텀 스케줄 옵션 레이어 -->
        <div id="scheduleMenu" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-xl z-20 max-h-64 overflow-y-auto divide-y divide-slate-100">
          <!-- JS로 오늘 날짜 기준 정렬되어 동적 생성됨 -->
        </div>
      </div>
    </section>

    <!-- 2. 실시간 생성 문구 미리보기 (위치 상단 이동 + 높이 유지) -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-2">
        <label class="text-sm font-bold text-slate-600 uppercase tracking-wider">
          생성될 문구 미리보기
        </label>
        <button onclick="copyToClipboardOnly()" class="text-xs text-blue-600 font-semibold hover:underline bg-blue-50 px-2.5 py-1 rounded-lg">
          복사
        </button>
      </div>
      <textarea id="previewText" rows="8" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono text-slate-800 outline-none focus:ring-1 focus:ring-blue-500 resize-none" placeholder="고객 및 진행 상태를 선택하면 문구가 자동으로 작성됩니다."></textarea>
      <!-- 3. 차량 정보 포함 여부 체크박스 -->
      <label class="flex items-center pt-2 space-x-3 cursor-pointer select-none">
        <input type="checkbox" id="includeCarInfo" onchange="onCarInfoToggle()" class="w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
        <span class="text-sm font-bold text-slate-700">차량 및 기사 배차 정보 포함</span>
      </label>
    </section>
    
    <!-- 4. 상태 선택 섹션 (2열 구성, 버튼 높이 확보) -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <label class="block text-sm font-bold text-slate-600 uppercase tracking-wider mb-1">
        상태 선택
      </label>

      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="selectStatus('고객 접견 완료')" class="py-4 px-3 bg-slate-800 hover:bg-slate-900 active:scale-[0.98] text-white font-bold rounded-xl shadow transition text-sm">
          고객 접견 완료
        </button>

        <button onclick="selectStatus('CIQ 수속장 이동 중')" class="py-4 px-3 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold rounded-xl shadow transition text-sm">
          CIQ 수속장 이동 중
        </button>

        <button onclick="selectStatus('보안검색 / 심사 중')" class="py-4 px-3 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold rounded-xl shadow transition text-sm">
          보안검색 / 심사 중
        </button>

        <button onclick="selectStatus('라운지 / 게이트 이동')" class="py-4 px-3 bg-purple-600 hover:bg-purple-700 active:scale-[0.98] text-white font-bold rounded-xl shadow transition text-sm">
          라운지 / 게이트 이동
        </button>

        <button onclick="selectStatus('최종 인계 / 안내 완료')" class="col-span-2 py-4 px-3 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold rounded-xl shadow transition text-sm">
          최종 인계 / 안내 완료
        </button>
      </div>
    </section>

    <!-- 5. 별도 최종 전송 버튼 -->
    <section class="pt-2">
      <button onclick="sendKakaoReport()" class="w-full py-4 bg-yellow-400 hover:bg-yellow-500 active:scale-[0.98] text-slate-900 font-extrabold text-base rounded-2xl shadow-md transition border border-yellow-300 flex justify-center items-center gap-2">
        <span>카카오톡으로 전송하기</span>
      </button>
    </section>

  </main>

  <!-- Toast 알림 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50">
    문구가 클립보드에 복사되었습니다.
  </div>

  <script>
    // ⚙️ 기본 설정
    const KAKAO_JAVASCRIPT_KEY = '9d471ba172dbeb48ead35224a6d1b241'; 
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzy6oj6qjsXsjYd9aKDJp5SwsTm4k3wVO7VWxLzR958Pw-yuw8suDfbX_ssCPA-zHvL/exec'; 

    let scheduleDataList = [];
    let currentSelected = null;
    let selectedTargetGroup = '';
    let currentStatusText = '진행 상황을 선택해 주세요.';

    const dayNames = ["일", "월", "화", "수", "목", "금", "토"];

    window.onload = function() {
      if (KAKAO_JAVASCRIPT_KEY && typeof Kakao !== 'undefined') {
        if (!Kakao.isInitialized()) {
          Kakao.init(KAKAO_JAVASCRIPT_KEY);
        }
      }
      loadSchedules();

      // 외부 클릭 시 드롭다운 레이어 닫기
      document.addEventListener('click', function(e) {
        const targetBtn = document.getElementById('targetGroupBtn');
        const targetMenu = document.getElementById('targetMenu');
        const schedCard = document.getElementById('selectedInfoCard');
        const schedMenu = document.getElementById('scheduleMenu');

        if (targetBtn && targetMenu && !targetBtn.contains(e.target) && !targetMenu.contains(e.target)) {
          targetMenu.classList.add('hidden');
        }
        if (schedCard && schedMenu && !schedCard.contains(e.target) && !schedMenu.contains(e.target)) {
          schedMenu.classList.add('hidden');
        }
      });
    };

    function getApiKeyFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('key');
    }

    function formatDateTime(dateVal, timeVal) {
      if (!dateVal && !timeVal) return "시간미정";

      let formattedDate = "";
      let formattedTime = "";

      if (dateVal) {
        const d = new Date(dateVal);
        if (!isNaN(d.getTime())) {
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          const dayOfWeek = dayNames[d.getDay()];
          formattedDate = `${month}.${day}(${dayOfWeek})`;
        } else {
          formattedDate = String(dateVal);
        }
      }

      if (timeVal) {
        formattedTime = convertTime(timeVal);
      } else {
        formattedTime = "시간미정";
      }

      return `${formattedDate} ${formattedTime}`.trim();
    }

    function convertTime(timeVal) {
      const t = new Date(timeVal);
      if (!isNaN(t.getTime())) {
        const hours = String(t.getHours()).padStart(2, '0');
        const minutes = String(t.getMinutes()).padStart(2, '0');
        return `${hours}:${minutes}`;
      } else if (typeof timeVal === 'string' && timeVal.includes(':')) {
        const timeParts = timeVal.split(':');
        return `${timeParts[0].padStart(2, '0')}:${timeParts[1].padStart(2, '0')}`;
      } else {
        return String(timeVal);
      }
    }

    /* 수신 대상 선택 */
    function toggleTargetMenu() {
      document.getElementById('targetMenu').classList.toggle('hidden');
      document.getElementById('scheduleMenu').classList.add('hidden');
    }

    function selectTargetGroup(value, labelText) {
      selectedTargetGroup = value;
      document.getElementById('targetGroupLabel').textContent = labelText;
      document.getElementById('targetMenu').classList.add('hidden');
      updatePreview();
    }

    /* 담당 고객 커스텀 메뉴 토글 */
    function toggleScheduleMenu() {
      document.getElementById('scheduleMenu').classList.toggle('hidden');
      document.getElementById('targetMenu').classList.add('hidden');
    }

    function selectSchedule(index) {
      if (!scheduleDataList[index]) return;
      
      currentSelected = scheduleDataList[index];
      const dateTimeFormatted = formatDateTime(currentSelected.date, currentSelected.scheduleTime);
      
      document.getElementById('scheduleMenu').classList.add('hidden');

      // 선택된 정보 카드 업데이트
      document.getElementById('cardGuest').textContent = `${currentSelected.guestName} 님`;
      document.getElementById('cardFlight').textContent = currentSelected.flightNo;
      document.getElementById('cardType').textContent = currentSelected.type;
      document.getElementById('cardTerminal').textContent = currentSelected.terminal;
      document.getElementById('cardTime').textContent = dateTimeFormatted;
      document.getElementById('cardDetails').classList.remove('hidden');

      updatePreview();
    }

    /**
     * 구글 시트 백엔드 통신 및 오늘 날짜 기준 Sorting
     */
    function loadSchedules() {
      const apiKey = getApiKeyFromUrl();

      if (!apiKey) {
        alert("접속 URL에 인증 키(?key=...)가 포함되어 있지 않습니다.");
        document.getElementById('cardGuest').textContent = "인증 키 없음";
        return;
      }

      document.getElementById('cardGuest').textContent = "목록을 불러오는 중...";
      const requestUrl = `${GAS_WEBAPP_URL}?key=${encodeURIComponent(apiKey)}`;

      fetch(requestUrl)
        .then(response => response.json())
        .then(res => {
          if (res.status === "success") {
            renderSchedules(res.data);
          } else {
            alert("인증 오류: URL 파라미터 시크릿 키 불일치");
            document.getElementById('cardGuest').textContent = "로딩 실패 (인증 오류)";
          }
        })
        .catch(err => {
          alert("네트워크 통신 에러: " + err);
          document.getElementById('cardGuest').textContent = "로딩 실패 (새로고침 요망)";
        });
    }

    function renderSchedules(data) {
      if (!data || data.length === 0) {
        document.getElementById('cardGuest').textContent = "스케줄 데이터 없음";
        return;
      }

      // 1. 오늘 날짜(YYYY-MM-DD) 구하기 (한국 시간 기준)
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const todayStr = `${year}-${month}-${day}`;

      // 2. 오늘 날짜에 해당하는 스케줄만 필터링 (item.date 가 'YYYY-MM-DD' 문자열이거나 Date 객체인 경우 처리)
      const todayData = data.filter(item => {
        if (!item.date) return false;
        
        let itemDateStr = "";
        if (typeof item.date === 'string') {
          // '2026-09-09' 또는 'Wed Sep 09 2026...' 포맷 처리
          if (item.date.includes('-')) {
            itemDateStr = item.date.substring(0, 10);
          } else {
            const d = new Date(item.date);
            if (!isNaN(d.getTime())) {
              const m = String(d.getMonth() + 1).padStart(2, '0');
              const dy = String(d.getDate()).padStart(2, '0');
              itemDateStr = `${d.getFullYear()}-${m}-${dy}`;
            }
          }
        } else if (item.date instanceof Date) {
          const m = String(item.date.getMonth() + 1).padStart(2, '0');
          const dy = String(item.date.getDate()).padStart(2, '0');
          itemDateStr = `${item.date.getFullYear()}-${m}-${dy}`;
        }

        return itemDateStr === todayStr;
      });

      if (todayData.length === 0) {
        document.getElementById('cardGuest').textContent = "오늘 예정된 스케줄이 없습니다";
        document.getElementById('cardFlight').textContent = "없음";
        document.getElementById('scheduleMenu').innerHTML = '<div class="p-3.5 text-xs text-slate-400">오늘 스케줄이 없습니다.</div>';
        currentSelected = null;
        return;
      }

      // 3. 오늘 스케줄 중 시간순 정렬
      todayData.sort((a, b) => {
        const timeA = a.scheduleTime || '99:99';
        const timeB = b.scheduleTime || '99:99';
        return timeA.localeCompare(timeB);
      });

      scheduleDataList = todayData;
      const menu = document.getElementById('scheduleMenu');
      menu.innerHTML = '';

      todayData.forEach((item, index) => {
        const dateTimeFormatted = formatDateTime(item.date, item.scheduleTime);
        const itemDiv = document.createElement('div');
        itemDiv.className = "p-3.5 text-xs hover:bg-slate-50 cursor-pointer font-medium text-slate-800";
        itemDiv.textContent = `[${item.type}] ${item.guestName} (${item.flightNo}) | ${dateTimeFormatted}`;
        itemDiv.onclick = function() { selectSchedule(index); };
        menu.appendChild(itemDiv);
      });

      // 초기 상태 세팅
      document.getElementById('cardGuest').textContent = "고객을 선택해 주세요 (클릭)";
      document.getElementById('cardFlight').textContent = "선택";
      document.getElementById('cardDetails').classList.add('hidden');
      currentSelected = null;
    }

    /* 차량 정보 체크박스 변경 시 미리보기 업데이트 */
    function onCarInfoToggle() {
      updatePreview();
    }

    let isStatusSelected = false;
    /* 상태 선택 시 미리보기만 업데이트 */
    function selectStatus(statusText) {
      currentStatusText = statusText;
      isStatusSelected = true;
      updatePreview();
    }

    function generateMessage() {
      if (!currentSelected) return "고객을 선택해 주세요.";

      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const currentTimeStr = `${hours}:${minutes}`;

      let header = "";
      let footer = "";

      switch(selectedTargetGroup) {
        case 'TEAM1':
          header = `[의전 1팀 현장 공유]`;
          footer = `팀원분들 참고 부탁드립니다.`;
          break;
        case 'TEAM2':
          header = `[의전 2팀 현장 공유]`;
          footer = `2팀 현장 동선 확인 부탁드립니다.`;
          break;
        case 'MANAGER':
          header = `[총괄 매니저 보고]`;
          footer = `특이사항 없이 계획대로 진행 중입니다.`;
          break;
        case 'CLIENT':
          header = `[VIP 의전 진행 경과보고]`;
          footer = `최상의 서비스로 정성껏 모시겠습니다.`;
          break;
        default:
          header = `[의전 진행 경과보고]`;
          footer = `차질 없이 진행 중입니다.`;
      }

      const dateTimeFormatted = formatDateTime(currentSelected.date, currentSelected.scheduleTime);
      const isCarInfoChecked = document.getElementById('includeCarInfo').checked;

      let carDetailsText = "";
      if (isCarInfoChecked) {
        const driverName = currentSelected.driverName || "지정 중";
        const driverPhone = currentSelected.driverPhone || "-";
        const carNo = currentSelected.carNo || "-";
        const carModel = currentSelected.carModel || "-";
        const eta = convertTime(currentSelected.eta) || "-";

        carDetailsText = `\n\n[차량 정보]\n• 배차/차량: ${carModel} (${carNo})\n` +
                         `• 기사정보: ${driverName} (${driverPhone})\n` + `• 도착 예정 시간: ${eta}`;
      }

      return `${header}\n` +
             `• 고객명: ${currentSelected.guestName} (${currentSelected.flightNo})\n` +
             `• 구분/터미널: ${currentSelected.type} / ${currentSelected.terminal}\n` +
             `• 예정일시: ${dateTimeFormatted}\n` +
             `• 현재상황: ${currentStatusText}\n` +
             `• 보고시각: ${currentTimeStr}` +
             `${carDetailsText}\n\n` +
             `${footer}`;
    }

    function updatePreview() {
      if (!currentSelected) {
        document.getElementById('previewText').value = "고객을 먼저 선택해 주세요.";
        return;
      }
      const msg = generateMessage();
      document.getElementById('previewText').value = msg;
    }

    /* 하단 별도 전송 버튼 클릭 시 카카오톡 전송 실행 */
    function sendKakaoReport() {
      if (!currentSelected) {
        alert("고객을 먼저 선택해 주세요.");
        return;
      }

      if (!isStatusSelected) {
        alert("진행 상태를 먼저 선택해 주세요.");
        return;
      }

      let finalMsg = document.getElementById('previewText').value;
      if (!finalMsg || finalMsg.includes("고객을 먼저 선택해 주세요")) {
        finalMsg = generateMessage();
        document.getElementById('previewText').value = finalMsg;
      }

      // 클립보드 복사 백업
      navigator.clipboard.writeText(finalMsg).catch(() => {});

      // 진동 피드백
      if (navigator.vibrate) navigator.vibrate(50);

      // Kakao SDK 공유 실행
      if (typeof Kakao !== 'undefined' && Kakao.isInitialized()) {
        Kakao.Share.sendDefault({
          objectType: 'text',
          text: finalMsg,
          link: {
            mobileWebUrl: "https://premiumpassintl.com/concierge",
            webUrl: "https://premiumpassintl.com/concierge",
          },
          buttonTitle: "홈페이지"
        });
      } else {
        alert("카카오 SDK 초기화에 실패했습니다.");
      }
    }

    function copyToClipboardOnly() {
      const text = document.getElementById('previewText').value;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast("미리보기 문구가 복사되었습니다.");
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }
  </script>
</body>
</html>
