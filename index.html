<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PPI Protocol Status Reporter</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Kakao JavaScript SDK -->
  <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-blue-200 min-h-screen pb-10">

  <!-- Header -->
  <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
    <h1 class="text-lg font-bold tracking-tight">PPI Protocol</h1>
    <button onclick="loadSchedules()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition">
      새로고침
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- 0. 보고 수신 대상 지정 (커스텀 드롭다운) -->
    <section class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 relative">
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
        보고 수신 대상 선택
      </label>
      
      <!-- 커스텀 드롭다운 버튼 -->
      <button id="targetGroupBtn" onclick="toggleTargetMenu()" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-3 text-left font-semibold flex justify-between items-center">
        <span id="targetGroupLabel">[의전 현장 1팀 단체방]</span>
        <span class="text-xs text-slate-400">▼</span>
      </button>

      <!-- 커스텀 옵션 레이어 -->
      <div id="targetMenu" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-30 overflow-hidden divide-y divide-slate-100">
        <div onclick="selectTargetGroup('TEAM1', '[의전 현장 1팀 단체방]')" class="p-3 text-sm hover:bg-slate-50 cursor-pointer font-medium">
          [의전 현장 1팀 단체방]
        </div>
        <div onclick="selectTargetGroup('TEAM2', '[의전 현장 2팀 단체방]')" class="p-3 text-sm hover:bg-slate-50 cursor-pointer font-medium">
          [의전 현장 2팀 단체방]
        </div>
        <div onclick="selectTargetGroup('MANAGER', '[총괄 매니저 직보고]')" class="p-3 text-sm hover:bg-slate-50 cursor-pointer font-medium">
          [총괄 매니저 직보고]
        </div>
        <div onclick="selectTargetGroup('CLIENT', '[클라이언트 / B2B 전용]')" class="p-3 text-sm hover:bg-slate-50 cursor-pointer font-medium">
          [클라이언트 / B2B 전용]
        </div>
      </div>
    </section>

    <!-- 1. 스케줄 선택 섹션 (커스텀 드롭다운) -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 relative">
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
        1. 담당 고객 선택
      </label>

      <!-- 커스텀 스케줄 선택 버튼 -->
      <button id="scheduleBtn" onclick="toggleScheduleMenu()" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-3 text-left font-medium flex justify-between items-center">
        <span id="scheduleLabel">스케줄을 불러오는 중...</span>
        <span class="text-xs text-slate-400">▼</span>
      </button>

      <!-- 커스텀 스케줄 옵션 레이어 -->
      <div id="scheduleMenu" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-20 max-h-60 overflow-y-auto divide-y divide-slate-100">
        <!-- JS로 동적 생성됨 -->
      </div>
      
      <!-- 선택된 고객 요약 정보 -->
      <div id="selectedInfoCard" class="mt-3 p-3 bg-blue-50 rounded-xl border border-blue-100 hidden">
        <div class="flex justify-between items-center text-sm font-bold text-blue-900">
          <span id="cardGuest">-</span>
          <span id="cardFlight" class="bg-blue-200 px-2 py-0.5 rounded text-xs text-blue-800">-</span>
        </div>
        <div class="text-xs text-blue-700 mt-1.5 flex gap-3">
          <span>구분: <strong id="cardType">-</strong></span>
          <span>터미널: <strong id="cardTerminal">-</strong></span>
          <span>예정시각: <strong id="cardTime">-</strong></span>
        </div>
      </div>
    </section>

    <!-- 2. 상태 선택 섹션 -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-2.5">
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">
        2. 상태 선택
      </label>

      <div class="grid grid-cols-1 gap-2.5">
        <button onclick="triggerReport('고객 접견 완료')" class="w-full py-3.5 px-4 bg-slate-800 hover:bg-slate-900 active:scale-[0.98] text-white font-bold rounded-xl shadow transition flex items-center justify-between">
          <span>고객 접견 완료</span>
          <span class="text-xs font-normal text-slate-400">전송</span>
        </button>

        <button onclick="triggerReport('CIQ 수속장 이동 중')" class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold rounded-xl shadow transition flex items-center justify-between">
          <span>CIQ 수속장 이동 중</span>
          <span class="text-xs font-normal text-blue-200">전송</span>
        </button>

        <button onclick="triggerReport('보안검색 및 출국심사 진행 중')" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold rounded-xl shadow transition flex items-center justify-between">
          <span>보안검색 / 심사 중</span>
          <span class="text-xs font-normal text-indigo-200">전송</span>
        </button>

        <button onclick="triggerReport('라운지 / 게이트 이동 중')" class="w-full py-3.5 px-4 bg-purple-600 hover:bg-purple-700 active:scale-[0.98] text-white font-bold rounded-xl shadow transition flex items-center justify-between">
          <span>라운지 / 게이트 이동</span>
          <span class="text-xs font-normal text-purple-200">전송</span>
        </button>

        <button onclick="triggerReport('최종 인계 및 탑승 안내 완료')" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold rounded-xl shadow transition flex items-center justify-between">
          <span>최종 인계 / 안내 완료</span>
          <span class="text-xs font-normal text-emerald-200">전송</span>
        </button>
      </div>
    </section>

    <!-- 3. 실시간 생성 문구 미리보기 (수정 가능 + 1.5배 높이) -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-2">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">
          생성될 문구 미리보기
        </label>
        <button onclick="copyToClipboardOnly()" class="text-xs text-blue-600 font-semibold hover:underline">
          복사
        </button>
      </div>
      <textarea id="previewText" rows="9" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono text-slate-700 outline-none focus:ring-1 focus:ring-blue-500 resize-none"></textarea>
    </section>

  </main>

  <!-- Toast 알림 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50">
    문구가 클립보드에 복사되었습니다.
  </div>

  <script>
    const KAKAO_JAVASCRIPT_KEY = '9d471ba172dbeb48ead35224a6d1b241'; 
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzy6oj6qjsXsjYd9aKDJp5SwsTm4k3wVO7VWxLzR958Pw-yuw8suDfbX_ssCPA-zHvL/exec'; 

    let scheduleDataList = [];
    let currentSelected = null;
    let selectedTargetGroup = 'TEAM1';
    let lastStatusText = "진행 상황을 선택해 주세요.";

    const dayNames = ["일", "월", "화", "수", "목", "금", "토"];

    window.onload = function() {
      if (KAKAO_JAVASCRIPT_KEY && typeof Kakao !== 'undefined') {
        if (!Kakao.isInitialized()) {
          Kakao.init(KAKAO_JAVASCRIPT_KEY);
        }
      }
      loadSchedules();

      // 외부 클릭 시 커스텀 드롭다운 메뉴 닫기
      document.addEventListener('click', function(e) {
        const targetBtn = document.getElementById('targetGroupBtn');
        const targetMenu = document.getElementById('targetMenu');
        const schedBtn = document.getElementById('scheduleBtn');
        const schedMenu = document.getElementById('scheduleMenu');

        if (targetBtn && targetMenu && !targetBtn.contains(e.target) && !targetMenu.contains(e.target)) {
          targetMenu.classList.add('hidden');
        }
        if (schedBtn && schedMenu && !schedBtn.contains(e.target) && !schedMenu.contains(e.target)) {
          schedMenu.classList.add('hidden');
        }
      });
    };

    function getApiKeyFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('key');
    }

    /**
     * MM.DD(요일) HH:mm 형태로 날짜/시간 포맷팅
     */
    function formatDateTime(dateVal, timeVal) {
      if (!dateVal && !timeVal) return "시간미정";

      let formattedDate = "";
      let formattedTime = "";

      // 1. 날짜 처리 (dateVal에서 월.일(요일) 추출)
      if (dateVal) {
        const d = new Date(dateVal);
        if (!isNaN(d.getTime())) {
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          const dayOfWeek = dayNames[d.getDay()];
          formattedDate = `${month}.${day}(${dayOfWeek})`;
        } else {
          formattedDate = String(dateVal);
        }
      }

      // 2. 시간 처리 (timeVal에서 시:분 추출)
      if (timeVal) {
        const t = new Date(timeVal);
        if (!isNaN(t.getTime())) {
          const hours = String(t.getHours()).padStart(2, '0');
          const minutes = String(t.getMinutes()).padStart(2, '0');
          formattedTime = `${hours}:${minutes}`;
        } else if (typeof timeVal === 'string' && timeVal.includes(':')) {
          // HH:mm 또는 HH:mm:ss 형태의 문자열일 경우
          const timeParts = timeVal.split(':');
          formattedTime = `${timeParts[0].padStart(2, '0')}:${timeParts[1].padStart(2, '0')}`;
        } else {
          formattedTime = String(timeVal);
        }
      } else {
        formattedTime = "시간미정";
      }

      return `${formattedDate} ${formattedTime}`.trim();
    }

    /* 커스텀 타겟 그룹 메뉴 */
    function toggleTargetMenu() {
      document.getElementById('targetMenu').classList.toggle('hidden');
      document.getElementById('scheduleMenu').classList.add('hidden');
    }

    function selectTargetGroup(value, labelText) {
      selectedTargetGroup = value;
      document.getElementById('targetGroupLabel').textContent = labelText;
      document.getElementById('targetMenu').classList.add('hidden');
      updatePreview(lastStatusText);
    }

    /* 커스텀 스케줄 메뉴 */
    function toggleScheduleMenu() {
      document.getElementById('scheduleMenu').classList.toggle('hidden');
      document.getElementById('targetMenu').classList.add('hidden');
    }

    function selectSchedule(index) {
      if (!scheduleDataList[index]) return;
      
      currentSelected = scheduleDataList[index];
      const dateTimeFormatted = formatDateTime(currentSelected.date, currentSelected.scheduleTime);
      
      document.getElementById('scheduleLabel').textContent = `[${currentSelected.type}] ${currentSelected.guestName} (${currentSelected.flightNo}) | ${dateTimeFormatted}`;
      document.getElementById('scheduleMenu').classList.add('hidden');

      // Card Update
      document.getElementById('cardGuest').textContent = `${currentSelected.guestName} 님`;
      document.getElementById('cardFlight').textContent = currentSelected.flightNo;
      document.getElementById('cardType').textContent = currentSelected.type;
      document.getElementById('cardTerminal').textContent = currentSelected.terminal;
      document.getElementById('cardTime').textContent = dateTimeFormatted;
      document.getElementById('selectedInfoCard').classList.remove('hidden');

      updatePreview("진행 상황을 선택해 주세요.");
    }

    /**
     * Apps Script 백엔드로 데이터 요청
     */
    function loadSchedules() {
      const apiKey = getApiKeyFromUrl();

      if (!apiKey) {
        alert("접속 URL에 인증 키(?key=...)가 포함되어 있지 않습니다.");
        document.getElementById('scheduleLabel').textContent = "인증 키 없음 (URL을 확인해 주세요)";
        return;
      }

      document.getElementById('scheduleLabel').textContent = "시트에서 목록을 불러오는 중...";
      
      // 접속 URL에서 추출한 key 값을 백엔드로 전송
      const requestUrl = `${GAS_WEBAPP_URL}?key=${encodeURIComponent(apiKey)}`;

      fetch(requestUrl)
        .then(response => response.json())
        .then(res => {
          if (res.status === "success") {
            renderSchedules(res.data);
          } else {
            alert("인증 오류: URL 파라미터의 시크릿 키가 일치하지 않습니다.");
            document.getElementById('scheduleLabel').textContent = "로딩 실패 (인증 오류)";
          }
        })
        .catch(err => {
          alert("네트워크 통신 에러: " + err);
          document.getElementById('scheduleLabel').textContent = "로딩 실패 (새로고침해 주세요)";
        });
    }

    function renderSchedules(data) { console.log(data);
      scheduleDataList = data;
      const menu = document.getElementById('scheduleMenu');
      menu.innerHTML = '';

      if (!data || data.length === 0) {
        document.getElementById('scheduleLabel').textContent = "등록된 스케줄 데이터가 없습니다.";
        document.getElementById('selectedInfoCard').classList.add('hidden');
        return;
      }

      data.forEach((item, index) => {
        const dateTimeFormatted = formatDateTime(item.date, item.scheduleTime);
        const itemDiv = document.createElement('div');
        itemDiv.className = "p-3 text-xs hover:bg-slate-50 cursor-pointer font-medium text-slate-800";
        itemDiv.textContent = `[${item.type}] ${item.guestName} (${item.flightNo}) | ${dateTimeFormatted}`;
        itemDiv.onclick = function() { selectSchedule(index); };
        menu.appendChild(itemDiv);
      });

      // 첫 번째 항목 기본 선택
      selectSchedule(0);
    }

    function generateMessage(statusText) {
      if (!currentSelected) return "고객을 먼저 선택해 주세요.";

      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const currentTimeStr = `${hours}:${minutes}`;

      let header = "";
      let footer = "";

      switch(selectedTargetGroup) {
        case 'TEAM1':
          header = `[의전 1팀 현장 공유]`;
          footer = `팀원분들 참고 부탁드립니다.`;
          break;
        case 'TEAM2':
          header = `[의전 2팀 현장 공유]`;
          footer = `2팀 현장 동선 확인 부탁드립니다.`;
          break;
        case 'MANAGER':
          header = `[총괄 매니저 보고]`;
          footer = `특이사항 없이 계획대로 진행 중입니다.`;
          break;
        case 'CLIENT':
          header = `[VIP 의전 진행 경과보고]`;
          footer = `최상의 서비스로 정성껏 모시겠습니다.`;
          break;
        default:
          header = `[의전 진행 경과보고]`;
          footer = `차질 없이 진행 중입니다.`;
      }

      const dateTimeFormatted = formatDateTime(currentSelected.date, currentSelected.scheduleTime);

      return `${header}\n` +
             `• 고객명: ${currentSelected.guestName} (${currentSelected.flightNo})\n` +
             `• 구분/터미널: ${currentSelected.type} / ${currentSelected.terminal}\n` +
             `• 예정일시: ${dateTimeFormatted}\n` +
             `• 현재상황: ${statusText}\n` +
             `• 보고시각: ${currentTimeStr}\n\n` +
             `${footer}`;
    }

    function updatePreview(statusText) {
      lastStatusText = statusText;
      const msg = generateMessage(statusText);
      document.getElementById('previewText').value = msg;
    }

    function triggerReport(statusText) {
      if (!currentSelected) {
        alert("고객을 먼저 선택해 주세요.");
        return;
      }

      lastStatusText = statusText;
      
      let finalMsg = document.getElementById('previewText').value;
      if (!finalMsg || finalMsg.includes("고객을 먼저 선택해 주세요")) {
        finalMsg = generateMessage(statusText);
        document.getElementById('previewText').value = finalMsg;
      }

      // 클립보드 복사
      navigator.clipboard.writeText(finalMsg).catch(() => {});

      // 진동 피드백
      if (navigator.vibrate) navigator.vibrate(50);

      // Kakao SDK 공유 실행
      if (typeof Kakao !== 'undefined' && Kakao.isInitialized()) {
        Kakao.Share.sendDefault({
          objectType: 'text',
          text: finalMsg,
          link: {
              mobileWebUrl: "https://premiumpassintl.com/concierge",
              webUrl: "https://premiumpassintl.com/concierge",
            },
          buttonTitle: "홈페이지"
        });
      } else {
        alert("카카오 SDK 초기화에 실패했습니다.");
      }
    }

    function copyToClipboardOnly() {
      const text = document.getElementById('previewText').value;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast("미리보기 문구가 복사되었습니다.");
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }
  </script>
</body>
</html>
